name: Deploy to GitHub Pages
env:
    PUBLISH_DIR: Prerender/output/wwwroot

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Publish app
      run: dotnet publish PGDevOpsTips.Web/PGDevOpsTips.Web.csproj -c Release -o Prerender/output --nologo
    
    # Use NodeJS react-snap utitility to prerender static website
    - name: prerender Blazor client
      working-directory: Prerender
      run: npx react-snap

    # react-snap saves the scripts Blazor injects at runtime. Remove them: Blazor adds both again
    # when the page starts, using the correct file name for this build.
    - name: Remove captured Blazor loader scripts
      working-directory: Prerender/output/wwwroot
      run: |
        find . -name "*.html" -print0 | while IFS= read -r -d '' htmlFile; do
          perl -0777 -pi -e 's{<script[^>]*>[^<]*__wasmmodulecallback__[^<]*</script>}{}g' "$htmlFile"
          perl -0777 -pi -e 's{<script[^>]*src=["\x27]?_framework/dotnet[^\s>"\x27]*["\x27]?[^>]*>\s*</script>}{}g' "$htmlFile"
        done
    
    # copy index.html to 404.html to serve the same file when a file is not found
    - name: copy index.html to 404.html
      run: cp Prerender/output/wwwroot/index.html Prerender/output/wwwroot/404.html

    - name: Generate the sitemap
      id: sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        path-to-root: ./Prerender/output/wwwroot/
        base-url-path: https://www.pgdevopstips.co.uk/
    
    - name: Output stats
      run: |
        echo "sitemap-path = ${{ steps.sitemap.outputs.sitemap-path }}"
        echo "url-count = ${{ steps.sitemap.outputs.url-count }}"
        echo "excluded-count = ${{ steps.sitemap.outputs.excluded-count }}"

    # Allow files and folders starting with an underscore
    - name: Add .nojekyll file
      run: touch Prerender/output/wwwroot/.nojekyll

    - name: GitHub Pages
      if: success()
      uses: crazy-max/ghaction-github-pages@v1.5.1
      with:
        target_branch: gh-pages
        build_dir: ${{ env.PUBLISH_DIR }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
